<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            background-color: rgb(35, 28, 37);
            font-family: sans-serif;
        }
        #score{
            border: 1px solid wheat;
            padding: 2px 4px;
            background-color: aliceblue;
            color: black;
            text-align: center;
            margin: 3px;
            justify-self: center;
            align-self: center;
            
        }
        .container{
            height: 250px;
            display: flex;
            flex-direction: row;
            width: 250px;
            align-items: start;
            justify-content: center;
            flex-wrap: wrap;
            border: 3px solid black;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 0px 3px;
            color: wheat;
            background-color: rgb(0, 11, 70);
        }
        button{
            background-color: wheat;
            color: black;
            border-radius: 7px;
            font-weight: bold;
            padding: 5px 10px;
            margin: 5px;
        }
        #result{
            min-width: 40px;
            min-height: 20px;
            font-size: 14px;
        }
        #won{
             min-width: 250px;
             text-align: center;
            min-height: 20px;
            font-size: 14px;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="score">0-0</div>
        <div id="won"></div>
        <h2>Rock Paper Scissors</h2>
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
        <div id="result"></div>
    </div>
<script src="script.js"></script>
</body>
</html>
